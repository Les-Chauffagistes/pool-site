services:
  postgres:
    image: postgres:18.1-alpine3.23
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chauffagistes
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Port de la db

